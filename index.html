
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>แนะนำตัวเอง</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            text-align: center;
            padding: 50px;
        }

        .profile {
            background: #1e293b;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px #38bdf8;
        }

        h1 {
            color: #38bdf8;
            font-size: 30px;
        }

        p {
            background: #334155;
            padding: 12px;
            border-radius: 10px;
            margin: 12px 0;
        }

        p:hover {
            background: #0284c7;
            transform: scale(1.05);
            transition: 0.3s;
        }

        .footer {
            color: #94a3b8;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="profile">

        <h1>ประวัติส่วนตัว</h1>

        <p>👤 ชื่อ : ธีรภัทร์</p>
        <p>🎂 อายุ : 16 ปี</p>
        <p>💻 แผนก : เทคโนโลยีสารสนเทศ</p>
        <p>🎮 งานอดิเรก : เล่นเกม ฟังเพลง</p>
        <p>🚀 ความฝัน : เป็นโปรแกรมเมอร์</p>

        <div class="footer">
            <p>Welcome to my profile!</p>
        </div>

    </div>

</body>
</html>
